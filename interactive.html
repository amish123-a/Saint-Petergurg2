<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPB Planner ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff4d6d;
            --bg: #0b0e14;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #0b0e14);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .nav-back {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
        }

        .nav-back a {
            color: white;
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 300;
            transition: all 0.4s ease;
            opacity: 0.6;
        }

        .nav-back a:hover { 
            letter-spacing: 6px; 
            opacity: 1; 
        }

        #app {
            width: 90%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--pink);
            width: 0%;
            transition: width 0.4s;
            border-radius: 30px 30px 0 0;
        }

        .screen { 
            display: none; 
            animation: fadeIn 0.5s ease forwards; 
        }
        .screen.active { 
            display: block; 
        }

        h1 { 
            font-size: 1.5rem; 
            margin-bottom: 15px; 
        }
        p.subtitle { 
            font-weight: 300; 
            color: #ccc; 
            margin-bottom: 30px; 
            font-size: 0.9rem; 
            line-height: 1.4; 
        }

        .options { 
            display: grid; 
            gap: 10px; 
        }

        button {
            background: rgba(255, 255, 255, 0.05);            
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 15px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        button:hover {
            background: var(--pink);
            border-color: var(--pink);
        }

        .btn-main {
            background: var(--pink);
            padding: 16px 40px;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            margin-top: 10px;
            color: white;
            cursor: pointer;
        }

        .ticket {
            background: #fff;
            color: #222;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 20px;
            text-align: left;
        }
        .ticket img { 
            width: 100%; 
            height: 160px; 
            object-fit: cover; 
        }
        .ticket-info { 
            padding: 20px; 
        }
        .ticket h2 { margin: 0; color: var(--pink); font-size: 1.3rem; }
        .ticket p { font-size: 0.85rem; color: #444; margin: 8px 0; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="nav-back"><a href="index.html#spb-mood-block">← На главную</a></div>

    <div id="app">
        <div class="progress-bar" id="progress"></div>

        <div id="start-screen" class="screen active">
            <div style="font-size: 3.5rem; margin-bottom: 15px;">🏛️</div>
            <h1>Питерский Вечер</h1>
            <p class="subtitle">Давай решим, куда мы отправимся сегодня. Квиз знает город лучше всех!</p>
            <button class="btn-main" onclick="startQuiz()">Начать ➔</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h1 id="question-text">Вопрос</h1>
            <div class="options" id="options-container"></div>
        </div>

        <div id="result-screen" class="screen">
            <h1 style="font-size: 1.2rem;">Место по твоему вайбу:</h1>
            <div class="ticket">
                <img src="" id="res-img">
                <div class="ticket-info">
                    <h2 id="res-title">Название</h2>
                    <p id="res-desc">Описание</p>
                    <small id="res-addr" style="color: #888;">Адрес</small>
                </div>
            </div>
            <button class="btn-main" style="width: 100%; margin-top: 25px;" onclick="location.reload()">Пройти заново</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        const questions = [
            {
                q: "Какое настроение выберем?",
                options: [
                    { text: "Тихий и уютный вечер 🕯️", val: "cozy" },
                    { text: "Активная прогулка 🏃‍♂️", val: "active" },
                    { text: "Культурное просвещение 🖼️", val: "art" },
                    { text: "Винный вечер ✨", val: "wine" }
                ]
            },
            {
                q: "Что по еде?",
                options: [
                    { text: "Кофе и легендарные пышки 🍩", val: "sweet" },
                    { text: "Стильный гастро-бар 🍹", val: "bar" },
                    { text: "Уличная еда у воды 🍕", val: "water" },
                    { text: "Изысканный ресторан 🍽️", val: "fancy" }
                ]
            },
            {
                q: "Идеальный вид для тебя — это...",options: [
                    { text: "На Неву и мосты 🌊", val: "river" },
                    { text: "На крыши города 🔭", val: "roof" },
                    { text: "На исторические дворики 🚪", val: "yard" },
                    { text: "На современные здания 🏭", val: "modern" }
                ]
            }
        ];

        let currentStep = 0;
        let userAnswers = [];

        function startQuiz() {
            currentStep = 0;
            userAnswers = [];
            showScreen('quiz-screen');
            updateQuiz();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function updateQuiz() {
            const qData = questions[currentStep];
            document.getElementById('question-text').innerText = qData.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt.text;
                btn.onclick = () => nextStep(opt.val);
                container.appendChild(btn);
            });

            document.getElementById('progress').style.width = (currentStep / questions.length * 100) + "%";
        }

        function nextStep(val) {
            userAnswers.push(val);
            currentStep++;
            if (currentStep < questions.length) {
                updateQuiz();
            } else {
                showResult();
            }
        }

        function showResult() {
            showScreen('result-screen');
            document.getElementById('progress').style.width = "100%";

            const title = document.getElementById('res-title');
            const desc = document.getElementById('res-desc');
            const addr = document.getElementById('res-addr');
            const img = document.getElementById('res-img');

            if (userAnswers.includes('water') || userAnswers.includes('river')) {
                title.innerText = "Севкабель Порт";
                desc.innerText = "Смотрим на залив, пьем сидр и ловим морской ветер. Лучшее место для заката.";
                addr.innerText = "📍 Кожевенная линия, 40";
                img.src = "севкабель.jpg";
            } else if (userAnswers.includes('art') || userAnswers.includes('yard')) {
                title.innerText = "Анненкирхе";
                desc.innerText = "Мистическая обгоревшая церковь с невероятной историей и выставками.";
                addr.innerText = "📍 Кирочная ул., 8В";
                img.src = "Снимок экрана 2026-05-20 083450.png";
            } else if (userAnswers.includes('wine') || userAnswers.includes('bar')) {
                title.innerText = "Улица Некрасова";
                desc.innerText = "Барный квартал для тех, кто любит авторские напитки и душевные разговоры.";
                addr.innerText = "📍 Центральный район";
                img.src = "УлицаНекрасова.webp";
            } else {
                title.innerText = "Новая Голландия";
                desc.innerText = "Самый красивый остров города с газонами, ресторанами и крутой атмосферой.";
                addr.innerText = "📍 наб. Адмиралтейского канала, 2";
                img.src = "НоваяГолландия.jpg";
            }

            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
